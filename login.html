<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign In | Little Hearts Child Welfare Trust</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-body">
  <!-- Requirement 7: RTL and Theme button outside the card at top right corner -->
  <div class="auth-top-tools">
    <button class="tool-btn" id="rtlToggle" type="button" title="Toggle right-to-left layout" aria-label="Toggle RTL">RTL</button>
    <button class="tool-btn theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark/light theme" title="Toggle theme">◐</button>
  </div>

  <main class="auth-wrap">
    <!-- Centered Card, Strictly No Images -->
    <section class="auth-card">
      <!-- Requirement 7: Brandname inside the card, aligned to center -->
      <a class="brand auth-card-brand" href="index.html" aria-label="Little Hearts Child Welfare Trust">
        <span class="brand-mark">♡</span>
        <span>Little Hearts<small>CHILD WELFARE TRUST</small></span>
      </a>

      <div class="auth-header">
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Sign In to Your Account</h1>
        <p>Access your sponsor dashboard, volunteer schedule, or trust donor profile.</p>
      </div>

      <form id="authForm">
        <label>Email Address
          <input required type="email" name="email" placeholder="you@example.com" autocomplete="email">
        </label>
        <label>Password
          <input required type="password" name="password" placeholder="Enter your password" autocomplete="current-password">
        </label>

        <!-- Requirement 8: Terms & Conditions Checkbox -->
        <label class="terms-checkbox">
          <input type="checkbox" required name="terms">
          <span>I agree to the <a href="#" class="terms-link">Terms &amp; Conditions</a> and <a href="#" class="terms-link">Child Safeguarding Policy</a></span>
        </label>

        <button class="btn btn-primary full" type="submit">Sign In</button>
        <p class="form-status" aria-live="polite"></p>
      </form>

      <div class="auth-divider"><span>or continue with</span></div>

      <!-- Requirement 7: Social Media Icons Aligned Properly to Center (No Repetition) -->
      <div class="auth-social-row">
        <a class="social-auth-btn" href="#" aria-label="Sign in with Google" title="Google">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.24 10.285V13.4h6.887C18.2 15.633 15.645 18 12.24 18c-3.315 0-6-2.685-6-6s2.685-6 6-6c1.62 0 3.09.615 4.2 1.62l2.37-2.37C17.415 3.87 14.985 3 12.24 3 7.27 3 3.24 7.03 3.24 12s4.03 9 9 9c5.205 0 8.655-3.66 8.655-8.82 0-.6-.06-1.185-.165-1.895H12.24z"/></svg>
        </a>
        <a class="social-auth-btn" href="#" aria-label="Sign in with Facebook" title="Facebook">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/></svg>
        </a>
        <a class="social-auth-btn" href="#" aria-label="Sign in with Apple" title="Apple">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.07 1.71-.93 2.73 1 .08 2.02-.51 2.63-1.23z"/></svg>
        </a>
      </div>

      <p class="auth-switch">New supporter or volunteer? <a href="signup.html">Create an account</a></p>
      
      <div style="text-align: center; margin-top: 18px;">
        <a class="back-home" href="index.html">← Back to website</a>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
